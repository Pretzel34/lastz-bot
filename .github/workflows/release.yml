name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          NEW_TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Stamp version.py from tag
        shell: bash
        run: echo "__version__ = \"${{ steps.version.outputs.version }}\"" > version.py

      - name: Build executable
        run: .\build_windows.bat
        shell: cmd

      - name: Smoke-test executable
        shell: powershell
        timeout-minutes: 3
        run: |
          # v1.0.66 shipped a build that crashed on every launch (RuntimeError:
          # operator torchvision::nms does not exist) because PyInstaller's
          # static analysis silently failed to bundle torchvision's compiled
          # extension -- the build itself succeeded, so nothing here caught it
          # before the installer went out. This actually launches the frozen
          # exe and fails the workflow if it crashes on startup, instead of
          # only trusting that PyInstaller exited 0.
          $exe = "dist\LastZBot.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::$exe not found after build"
            exit 1
          }
          $stdout = "smoke_stdout.txt"
          $stderr = "smoke_stderr.txt"
          $proc = Start-Process -FilePath $exe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) {
            Write-Host "::error::LastZBot.exe exited within 12s of launch (exit code $($proc.ExitCode)) -- likely crashed on startup"
            Write-Host "--- stdout ---"
            Get-Content $stdout -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"
            Get-Content $stderr -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "LastZBot.exe still running after 12s -- startup smoke test passed"
          Stop-Process -Id $proc.Id -Force

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis /DAPP_VERSION=${{ steps.version.outputs.version }} installer.nsi
        shell: powershell

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Last Z Bot ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Installation
            1. Download `LastZBot-v${{ steps.version.outputs.version }}-Setup.exe` below
            2. Run it — app installs to Program Files and a Start Menu shortcut is created
            3. Future updates install automatically when you launch the app

            ### What's New
            See commit history for details.
          draft: false
          prerelease: false
          files: dist/LastZBot-v${{ steps.version.outputs.version }}-Setup.exe
